name: url-shortener

# Every host port can be overridden when something else already listens there:
#   API_HOST_PORT (3000), POSTGRES_HOST_PORT (5432), REDIS_HOST_PORT (6379),
#   TEST_POSTGRES_PORT (55433), TEST_REDIS_PORT (56380)
# The test ports are deliberately unusual so e2e runs cannot land on another project's database.
x-app-env: &app-env
  NODE_ENV: development
  BASE_URL: http://localhost:${API_HOST_PORT:-3000}
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/url_shortener
  REDIS_URL: redis://redis:6379
  IP_HASH_SECRET: dev-only-secret-change-me-please-0000
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      <<: *app-env
      PORT: 3000
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s

  worker:
    build: .
    command: ["node", "dist/worker"]
    environment:
      <<: *app-env
      WORKER_HEALTH_PORT: 3001
      # Shorten to "* * * * *" to watch the cleanup job run every minute.
      CLEANUP_CRON: ${CLEANUP_CRON:-*/15 * * * *}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s

  # Isolated databases for integration/e2e tests: `docker compose --profile test up -d postgres-test redis-test`
  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener_test
    ports:
      - "${TEST_POSTGRES_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-test:
    profiles: ["test"]
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${TEST_REDIS_PORT:-56380}:6379"

volumes:
  postgres-data:
